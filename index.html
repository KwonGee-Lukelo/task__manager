<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Gestionnaire de tache</title>
  </head>

  <body>
    <header>
      <section class="entete">
        <h1>Task Manager</h1>
      </section>

      <section class="analytics">
        <h2>Analytics</h2>
        <article>
          <div class="icon">
            <i class="ri-list-check" aria-hidden="true"></i>
          </div>
          <div class="stats">
            <div class="stats__chiffre" id="stats__chiffre"></div>
            <p class="stats__description">Total Tâches</p>
          </div>
        </article>

        <article>
          <div class="icon">
            <i class="ri-check-double-line" aria-hidden="true"></i>
          </div>
          <div class="stats">
            <div class="stats__chiffre" id="stats__chiffre"></div>
            <p class="stats__description">Tâches Terminées</p>
          </div>
        </article>

        <article>
          <div class="icon">
            <i class="ri-line-chart-line" aria-hidden="true"></i>
          </div>
          <div class="stats">
            <div class="stats__chiffre" id="stats__chiffre"></div>
            <p class="stats__description">Taux de complétion</p>
          </div>
        </article>
      </section>

      <section class="progress__bar">
        <h2>Progression</h2>
        <div class="progress__group">
          <div class="bar"></div>
          <span class="pourcentage"></span>
        </div>
      </section>
    </header>

    <main>
      <section class="features">
        <h2>Ajouter une tâche</h2>
        <section class="features__filter">
          <form action="">
            <input
              type="text"
              name="task"
              id="task"
              placeholder="Titre de la tâche..."
            />
            <i class="ri-list-indefinite saisis" aria-hidden="true"></i>

            <select id="priority">
              <option value="" selected>Priotité</option>
              <option value="Haute">Haute</option>
              <option value="Moyenne">Moyenne</option>
              <option value="Basse">Basse</option>
            </select>

            <button type="submit" value="Ajouter" id="submit">
              <i class="ri-add-line"></i> Ajouter
            </button>
            <p id="error"></p>
          </form>
        </section>

        <section class="features__tri">
          <button class="tous"><i class="ri-dashboard-line"></i>Toutes</button>
          <button class="encours">
            <i class="ri-progress-3-fill"></i>En cours
          </button>
          <button class="terminee">
            <i class="ri-checkbox-fill"></i>Terminées
          </button>
        </section>
      </section>

      <section class="tasks">
        <table class="table__form">
          <tbody>
            <tr>
              <td>
                <div class="item__group">
                  <div class="checkbox">
                    <input type="checkbox" name="" id="task__2" />
                    <label for="task__2">Créer la maquette HTML</label>
                  </div>

                  <div class="badge">
                    <span class="badge__haute"></span>
                    <p class="text__badgeHaute">Haute</p>
                  </div>
                </div>
              </td>

              <td>
                <div class="action__group">
                  <button><i class="ri-checkbox-circle-line"></i></button>
                  <button><i class="ri-delete-bin-6-line"></i></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="./assets/js/tache.js"></script>
  </body>
</html>
